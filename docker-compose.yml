services:
  db:
    image: mysql:8.0.36
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -u root -p"$${MYSQL_ROOT_PASSWORD}"
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      APP_KEY: ${APP_KEY}
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_TIMEOUT: ${DB_TIMEOUT:-2}
      SESSION_DRIVER: file
      LOG_CHANNEL: ${LOG_CHANNEL:-stdout}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_STDOUT_FORMATTER: ${LOG_STDOUT_FORMATTER:-Monolog\Formatter\JsonFormatter}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          php -r '$$context = stream_context_create(["http" => ["ignore_errors" => true]]);
          @file_get_contents("http://127.0.0.1:8000/health");
          $$status = $$http_response_header[0] ?? "";
          exit(str_contains($$status, " 200 ") ? 0 : 1);'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    command:
      - sh
      - -c
      - |
        until php artisan migrate --force && php artisan db:seed --force; do
          echo "Menunggu MySQL siap menerima koneksi..."
          sleep 3
        done
        exec frankenphp php-server --root public --listen :8000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data: